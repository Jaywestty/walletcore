# Local PostgreSQL for WalletCore.
#
# Two independent servers on purpose: the primary database for the app and a
# separate test database so tests can truncate freely without touching data you
# want to keep. The test database is also what testcontainers-based tests stand
# in for when run outside CI.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Wipe:   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: walletcore-postgres
    environment:
      POSTGRES_USER: walletcore
      POSTGRES_PASSWORD: walletcore
      POSTGRES_DB: walletcore
    ports:
      - "5432:5432"
    volumes:
      - walletcore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletcore -d walletcore"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: walletcore-postgres-test
    environment:
      POSTGRES_USER: walletcore
      POSTGRES_PASSWORD: walletcore
      POSTGRES_DB: walletcore_test
    ports:
      - "5433:5432"
    volumes:
      - walletcore_pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletcore -d walletcore_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  walletcore_pgdata:
  walletcore_pgdata_test:
